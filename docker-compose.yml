services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tradesentinel
      POSTGRES_PASSWORD: tradesentinel
      POSTGRES_DB: tradesentinel
    
  
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    # ❌ build: ./backend  --> ✅ image:
    image: your-dockerhub-username/tradesentinel-backend:latest
    command: alembic upgrade head
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    # ❌ volumes حذف شد:
    # volumes:
    #   - ./backend:/app

  api:
    # ❌ build: ./backend  --> ✅ image:
    image: your-dockerhub-username/tradesentinel-backend:latest
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ❌ volumes حذف شد:
    # volumes:
    #   - ./backend:/app

  worker:
    # ❌ build: ./backend  --> ✅ image:
    image: your-dockerhub-username/tradesentinel-backend:latest
    command: python -m app.workers.scheduler
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # ❌ volumes حذف شد:
    # volumes:
    #   - ./backend:/app

  frontend:
    # ❌ build: ./frontend  --> ✅ image:
    image: your-dockerhub-username/tradesentinel-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - api
    #
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules

volumes:
  postgres_data:
